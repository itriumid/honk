name: Release

# Pushing a `v*` tag builds the installers for every operating system and attaches them to a
# draft GitHub Release for that tag. Nothing is published automatically: review the draft, edit
# the notes, then publish it by hand.
#
# Run it manually (Actions → Release → Run workflow) for a dry run: it builds the same installers
# and keeps them as workflow artifacts, without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Any `permissions:` block replaces the default token scopes, so grant per job.
permissions: {}

# PowerShell on Windows let `pnpm` return before it finished; see build.yml.
defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tags are vMAJOR.MINOR.PATCH, nothing else: Windows installers only take numeric
      # versions, so a prerelease suffix would fail the Windows build partway through. And the
      # version lives in several files; a tag that disagrees with any of them would ship
      # installers labelled with a different version than the release.
      - name: Check the tag is a version and matches the app
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$TAG isn't a release tag. Use vMAJOR.MINOR.PATCH, e.g. v0.2.0 (see CONTRIBUTING.md, Versioning)."
            exit 1
          fi
          expected="${TAG#v}"
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          node=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          status=0
          for pair in "src-tauri/tauri.conf.json=$tauri" "package.json=$node" "src-tauri/Cargo.toml=$cargo"; do
            if [ "${pair#*=}" != "$expected" ]; then
              echo "::error file=${pair%%=*}::version is ${pair#*=}, but the tag is $TAG"
              status=1
            fi
          done
          exit $status

      # Created once here rather than by each build job, which would race to create it and could
      # leave duplicate drafts.
      - name: Create the draft release
        id: release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --generate-notes --title "Honk $TAG"
          # Draft releases aren't addressable by tag, so find this one's ID from the list.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -n 1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      # One operating system failing shouldn't cancel the others' uploads.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            # One universal build that runs on both Apple Silicon and Intel Macs.
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            arguments: --target universal-apple-darwin
          - name: Linux
            # The oldest supported Ubuntu, so the bundles link against a glibc old enough to run
            # on most distributions. Kept in step with build.yml.
            runner: ubuntu-22.04
          - name: Windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        # WebKitGTK and friends for Tauri, plus ALSA headers for cpal.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No Rust cache here on purpose: a release is built from a clean slate, so nothing a
      # pull request's cache picked up can end up inside a shipped installer.
      - name: Build and upload the installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Empty on a manual run, which makes the action build without uploading to a release.
          releaseId: ${{ needs.prepare.outputs.release-id }}
          args: ${{ matrix.arguments }}
          # Honk has no auto-updater, so there's no update manifest to publish.
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
